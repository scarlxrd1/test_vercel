<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Order Successful</title>
    
    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FAFAFA',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #ffffff; 
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans text-neutral-900 antialiased selection:bg-neutral-200 selection:text-neutral-900">

    <!-- ========================================== -->
    <!-- DYNAMIC NAVBAR PLACEHOLDER -->
    <!-- ========================================== -->
    <div id="navbar-container"></div>

    <!-- ========================================== -->
    <!-- SUCCESS MAIN CONTAINER -->
    <!-- ========================================== -->
    <main class="max-w-[1400px] mx-auto px-6 md:px-12 py-24 min-h-[75vh] flex flex-col items-center justify-center">
        
        <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mb-8 shadow-sm border border-green-100">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 data-i18n="success.title" class="font-serif text-4xl md:text-5xl text-neutral-900 mb-4 text-center">Thank you for your order.</h1>
        <p data-i18n="success.message" class="font-sans text-neutral-500 text-sm md:text-base text-center max-w-md mb-12 leading-relaxed">
            Your secure payment was successful and your order has been received. We will send you an email confirmation shortly.
        </p>

        <a href="collection.html" data-i18n="success.return_btn" class="bg-neutral-900 text-white font-sans text-xs tracking-widest uppercase px-10 py-5 rounded-sm hover:bg-neutral-800 transition-colors shadow-sm">
            Continue Shopping
        </a>

    </main>

    <!-- ========================================== -->
    <!-- DYNAMIC FOOTER PLACEHOLDER -->
    <!-- ========================================== -->
    <div id="footer-container"></div>

    <!-- Global Scripts -->
    <script type="module" src="./js/global.js"></script>
    
    <!-- Success Logic Script -->
    <script type="module" src="./js/success.js"></script>
</body>
</html>
